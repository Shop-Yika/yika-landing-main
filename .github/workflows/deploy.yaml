name: Deploy Next.js Application

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: jdmghk/yika-landing:latest
          target: runner
          build-args: |
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

  deploy:
    needs: build
    runs-on: self-hosted  # Ensure your self-hosted runner is properly configured
    steps:
      - name: Pull Docker image
        run: docker pull jdmghk/yika-landing:latest

      - name: Stop existing container
        run: |
          if [ "$(docker ps -aq -f name=yika-landing-container)" ]; then
            docker rm -f yika-landing-container 
          fi

      - name: Run new container
        run: |
          docker run -d \
            --init \
            --name yika-landing-container \
            -p 3000:3000 \
            -e NEXT_PUBLIC_BASE_URL="${{ secrets.NEXT_PUBLIC_BASE_URL }}" \
            -e CLERK_SECRET_KEY="${{ secrets.CLERK_SECRET_KEY }}" \
            -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" \
            jdmghk/yika-landing:latest

      - name: Verify deployment
        run: |
          sleep 10
          docker logs yika-landing-container
          curl -v http://localhost:3000 || exit 1

      - name: Clean up Docker resources
        run: |
          # Remove unused containers
          docker container prune -f
          # Remove unused images
          docker image prune -a -f
          # Remove unused volumes
          docker volume prune -f
          # Remove unused networks
          docker network prune -f